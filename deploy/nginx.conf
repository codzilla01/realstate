# Host-level nginx for a VPS install (no Docker):
#   - serves the built frontend from /var/www/realestate
#   - proxies /api to the Node process on 127.0.0.1:4000
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/realestate
#   sudo ln -s /etc/nginx/sites-available/realestate /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/realestate;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
